<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Atelier Najjar · Chevalets</title>
<!-- Source des chevalets de buffet (mail/chevalets-atelier-najjar.pdf), rendue en A4 avec Chromium.
     6 chevalets par page : découper le long des traits fins, plier sur le pointillé.
     Chaque chevalet fait 95 × 45 mm une fois plié, lisible des deux côtés.
     Pour changer les plats, modifier la liste PLATS ci-dessous. -->
<style>
@font-face { font-family:'Caslon D'; src:url('../polices/libre-caslon-display.woff2') format('woff2'); }
@font-face { font-family:'Caslon I'; src:url('../polices/libre-caslon-text-italique.woff2') format('woff2'); font-style:italic; }
@page { size:A4; margin:0; }
:root { --ivoire:#FBF8F3; --sable:#ECE3D6; --encre:#2A1E1A; --gris:#6F625A; --bordeaux:#5A1424; --or:#A88A5C; --filet:rgba(168,138,92,.45); }
* { box-sizing:border-box; }
html,body { margin:0; }
body { color:var(--encre); font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.page { width:210mm; height:297mm; padding:13.5mm 10mm; display:grid; grid-template-columns:repeat(2,95mm); grid-template-rows:repeat(3,90mm); break-after:page; overflow:hidden; }
.page:last-child { break-after:auto; }
.chevalet { position:relative; display:grid; grid-template-rows:45mm 45mm; outline:.15mm solid #ddd5ca; outline-offset:-.075mm; }
.chevalet::after { content:''; position:absolute; left:0; right:0; top:45mm; border-top:.2mm dashed #c9bfb2; }
/* Fond laissé au papier : imprimer sur un carton ivoire ou vergé crème. */
.face { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 9mm; }
.face::before { content:''; position:absolute; inset:3.2mm 3.2mm 3.2mm; border:.2mm solid var(--filet); pointer-events:none; }
.face.haut { transform:rotate(180deg); }
.logo { position:absolute; top:6.2mm; left:50%; height:3.9mm; transform:translateX(-50%); display:block; }
.tag { position:absolute; bottom:6.6mm; left:0; right:0; font-size:5.4pt; line-height:1; letter-spacing:.28em; text-transform:uppercase; color:var(--bordeaux); margin:0; }
.tag i { font-style:normal; color:var(--or); }
h2 { font:400 20pt/1.02 'Caslon D',Georgia,serif; margin:0; letter-spacing:-.01em; text-wrap:balance; }
h2.long { font-size:16.5pt; }
.ingr { font:italic 400 8.4pt/1.3 'Caslon I',Georgia,serif; color:var(--gris); margin:2.2mm 0 0; text-wrap:balance; }
.vierge img { height:5.2mm; }
</style></head>
<body>
<script>
// [catégorie, nom, ingrédients, végétarien]
const PLATS = [
  ['Mezzé', 'Hommos à la grenade', 'Tahiné, citron, grains de grenade', true],
  ['Mezzé', 'Labné aux agrumes', 'Zestes d’agrumes, pistache, menthe', true],
  ['Mezzé', 'Caviar d’aubergine fumé', 'Aubergine grillée au feu, sumac', true],
  ['Mezzé', 'Labné au thym et olives', 'Thym frais, olives noires, huile d’olive', true],
  ['Salade', 'Taboulé citronné', 'Persil plat, boulgour fin, tomate, grenade', true],
  ['Salade', 'Salade levantine', 'Agrumes, concombre, grenade, menthe', true],
  ['Bouchée', 'Falafels', 'Pois chiches, herbes, menthe', true],
  ['Bouchée', 'Feuilles de vigne', 'Riz, herbes, citron', true],
  ['Bouchée', 'Kebbé', 'Boulgour, viande, pignons de pin', false],
  ['Bouchée', 'Fatayer aux épinards', 'Oignon, sumac, citron', true],
  ['Bouchée', 'Samboussek au fromage', 'Pâte dorée, fromage fondant', true],
  ['Bouchée', 'Samboussek à la viande', 'Viande épicée, menthe fraîche', false],
  ['Mini-sandwich', 'Halloumi et aubergines grillées', 'Halloumi grillé, aubergine, salade, tahiné', true],
  ['Mini-sandwich', 'Za’atar et labné', 'Labné, za’atar, tomate, menthe', true],
  ['Mini-sandwich', 'Labné, tomate et concombre', 'Labné, tomate, concombre, menthe, huile d’olive', true],
  ['Mini-sandwich', 'Falafel et hommos', 'Falafel, hommos, feta, salade, tomate', true],
];
const LOGO = '../img/logo.svg';

const face = ([tag, nom, ingr, vg], cls) => `
  <div class="face ${cls}">
    <img class="logo" src="${LOGO}" alt="Atelier Najjar">
    <h2${nom.length > 24 ? ' class="long"' : ''}>${nom}</h2>
    <p class="ingr">${ingr}</p>
    <p class="tag">${tag}${vg ? ' <i>· Végétarien</i>' : ''}</p>
  </div>`;
const vierge = `<div class="chevalet vierge">${['haut', 'bas'].map(c => `<div class="face ${c}"><img src="${LOGO}" alt="Atelier Najjar"></div>`).join('')}</div>`;

const cartes = PLATS.map(p => `<div class="chevalet">${face(p, 'haut')}${face(p, 'bas')}</div>`);
while (cartes.length % 6) cartes.push(vierge);  // les places restantes : chevalets au logo seul
let html = '';
for (let i = 0; i < cartes.length; i += 6) html += `<div class="page">${cartes.slice(i, i + 6).join('')}</div>`;
document.body.insertAdjacentHTML('beforeend', html);
</script>
</body></html>
